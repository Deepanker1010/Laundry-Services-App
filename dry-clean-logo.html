<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dry Cleaning Logo</title>
</head>
<body>

  <dry-clean-logo brand="FreshFold" tagline="DRY CLEANING • LAUNDRY"></dry-clean-logo>

  <script>
    class DryCleanLogo extends HTMLElement {
      constructor() {
        super();

        const shadow = this.attachShadow({ mode: "open" });
        const brand = this.getAttribute("brand") || "FreshFold";
        const tagline = this.getAttribute("tagline") || "DRY CLEANING • LAUNDRY";

        shadow.innerHTML = `
          <style>
            :host {
              display: inline-block;
              font-family: Arial, sans-serif;
              color: #164e63;
            }

            .logo {
              display: flex;
              align-items: center;
              gap: 12px;
            }

            .icon {
              width: 58px;
              height: 58px;
              display: grid;
              place-items: center;
              border-radius: 16px;
              background: #e0f7fa;
              color: #06a8ff;
            }

            svg {
              width: 38px;
              height: 38px;
            }

            .brand {
              font-size: 24px;
              font-weight: 800;
              line-height: 1;
              letter-spacing: -0.5px;
            }

            .tagline {
              margin-top: 6px;
              color: #52717e;
              font-size: 10px;
              font-weight: 700;
              letter-spacing: 1.5px;
            }
          </style>

          <div class="logo" role="img" aria-label="${brand} ${tagline}">
            <div class="icon" aria-hidden="true">
              <svg viewBox="0 0 48 48" fill="none">
                <path d="M24 5C24 5 12 19 12 28a12 12 0 0 0 24 0C36 19 24 5 24 5Z"
                  fill="currentColor" opacity=".18"/>
                <path d="M24 5C24 5 12 19 12 28a12 12 0 0 0 24 0C36 19 24 5 24 5Z"
                  stroke="currentColor" stroke-width="3"/>
                <path d="M19 29c.5 3 2.4 4.8 5.5 5.2"
                  stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
              </svg>
            </div>
            <div>
              <div class="brand">${brand}</div>
              <div class="tagline">${tagline}</div>
            </div>
          </div>
        `;
      }
    }

    customElements.define("dry-clean-logo", DryCleanLogo);
  </script>
</body>
</html>
